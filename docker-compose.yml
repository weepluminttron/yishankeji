services:
  yishankeji:
    build:
      context: .
      dockerfile: Dockerfile
    image: yishankeji-acquisition:latest
    container_name: yishankeji
    restart: always
    ports:
      - "8017:8017"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8017
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-please-change-me}
