<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>获客分析看板</title>
<style>
  :root {
    --brand: #0e7dd6;
    --brand-2: #00b4d8;
    --brand-grad: linear-gradient(135deg, #0e7dd6, #00b4d8);
    --line: #e7edf5;
    --text: #1e2a3a;
    --muted: #7b8a9e;
    --green: #18a673;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    margin: 0;
    background:
      radial-gradient(900px 420px at 100% 0%, rgba(0, 180, 216, 0.1), transparent 60%),
      radial-gradient(800px 380px at 0 100%, rgba(14, 125, 214, 0.1), transparent 55%),
      #eef2f8;
    background-attachment: fixed;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(180deg, #15314f, #0d2236);
    color: #fff;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 16px rgba(13, 34, 54, 0.25);
    position: sticky; top: 0; z-index: 10;
  }
  header strong { font-size: 16px; font-weight: 800; letter-spacing: 0.3px; }
  header a {
    color: #93c5fd; text-decoration: none; font-size: 13px; margin-left: auto;
    padding: 7px 14px; border-radius: 9px; background: rgba(255, 255, 255, 0.08);
    transition: background 0.15s;
  }
  header a:hover { background: rgba(255, 255, 255, 0.16); }
  .wrap { max-width: 1080px; margin: 22px auto; padding: 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 4px 14px rgba(20, 40, 80, 0.06);
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(20, 40, 80, 0.1); }
  .kpi { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .kpi small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  h2 {
    font-size: 16px; font-weight: 700; margin: 28px 0 12px;
    display: flex; align-items: center; gap: 8px; color: #1e2a3a;
  }
  h2::before { content: ""; width: 4px; height: 16px; border-radius: 3px; background: var(--brand-grad); display: inline-block; }
  table {
    width: 100%; border-collapse: collapse; background: #fff;
    border-radius: 14px; overflow: hidden; box-shadow: 0 4px 14px rgba(20, 40, 80, 0.06);
    border: 1px solid var(--line);
  }
  th, td { padding: 11px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { background: #f7fafd; color: var(--muted); font-weight: 600; font-size: 12px; }
  tbody tr { transition: background 0.12s; }
  tbody tr:hover td { background: #f5f9fe; }
  tr:last-child td { border-bottom: none; }
  .bar { height: 9px; background: #e6edf6; border-radius: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--brand-grad); border-radius: 5px; transition: width 0.4s ease; }
  .hot { color: #e0564f; font-weight: 700; }
  .note { color: var(--muted); font-size: 12px; padding: 12px 2px; line-height: 1.7; }
  .funnel { display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; align-items: center; gap: 12px; }
  .step .lbl { width: 96px; font-size: 13px; font-weight: 600; }
  .step .bar { flex: 1; }
  .step .num { width: 70px; text-align: right; font-size: 13px; font-weight: 700; color: var(--brand); }
</style>
</head>
<body>
<header>
  <strong>📊 获客分析看板</strong>
  <span style="font-size:12px;color:#94a3b8;" id="gen"></span>
  <a href="/">← 返回管理后台</a>
</header>
<div class="wrap">
  <div class="grid" id="kpis"></div>

  <h2>转化漏斗</h2>
  <div class="card"><div class="funnel" id="funnel"></div></div>

  <h2>分来源转化率</h2>
  <table id="src"><thead><tr><th>来源</th><th>线索量</th><th>成交</th><th>转化率</th></tr></thead><tbody></tbody></table>

  <h2>分意向阶段转化率</h2>
  <table id="intent"><thead><tr><th>意向阶段</th><th>线索量</th><th>成交</th><th>转化率</th></tr></thead><tbody></tbody></table>

  <h2>触达效果</h2>
  <table id="touch"><thead><tr><th>分组</th><th>线索量</th><th>成交</th><th>成交率</th></tr></thead><tbody></tbody></table>

  <h2>WorkBuddy 等级分布（S/A/B/C）</h2>
  <table id="tier"><thead><tr><th>等级</th><th>线索量</th><th>成交</th><th>转化率</th></tr></thead><tbody></tbody></table>

  <h2>⭐ S/A 级优先跟进</h2>
  <table id="tierleads"><thead><tr><th>ID</th><th>公司</th><th>评分</th><th>等级</th><th>意向</th><th>建议动作</th><th>状态</th></tr></thead><tbody></tbody></table>

  <h2>🔥 高意向待跟进</h2>
  <table id="hot"><thead><tr><th>ID</th><th>公司</th><th>评分</th><th>意向</th><th>建议动作</th><th>状态</th></tr></thead><tbody></tbody></table>

  <p class="note" id="msg"></p>
</div>
<script>
function pct(n, d){ return d ? (n / d * 100).toFixed(1) + '%' : '0%'; }
function bar(v, max){ var w = max ? Math.max(2, v / max * 100) : 0; return '<div class="bar"><i style="width:'+w+'%"></i></div>'; }
function rows(tb, arr){ var b = tb.querySelector('tbody'); b.innerHTML = arr.map(function(r){ return '<tr>'+r+'</tr>'; }).join(''); }

fetch('/api/analytics').then(function(r){ return r.json(); }).then(function(d){
  if(!d.ok){ document.getElementById('msg').textContent = '加载失败：' + (d.msg || '请先在管理后台登录'); return; }
  var f = d.funnel;
  document.getElementById('gen').textContent = '生成于 ' + d.generated_at;
  document.getElementById('kpis').innerHTML = [
    ['总线索', f.total], ['已联系', f.contacted], ['跟进中', f.following],
    ['已成交', f.won], ['总转化率', f.conversion_rate + '%']
  ].map(function(k){ return '<div class="card"><div class="kpi">'+k[1]+' <small>'+k[0]+'</small></div></div>'; }).join('');

  var maxv = Math.max(f.total, 1);
  document.getElementById('funnel').innerHTML = [
    ['总线索', f.total], ['已联系', f.contacted], ['跟进中', f.following], ['已成交', f.won]
  ].map(function(s){ return '<div class="step"><span class="lbl">'+s[0]+'</span>'+bar(s[1], maxv)+'<span class="num">'+s[1]+'</span></div>'; }).join('');

  rows(document.getElementById('src'), d.by_source.map(function(s){
    return '<td>'+s.source+'</td><td>'+s.total+'</td><td>'+s.won+'</td><td>'+s.rate+'%</td>';
  }));
  rows(document.getElementById('intent'), d.by_intent.map(function(s){
    return '<td>'+s.stage+'</td><td>'+s.total+'</td><td>'+s.won+'</td><td>'+s.rate+'%</td>';
  }));
  var t = d.touch_effect;
  rows(document.getElementById('touch'), [
    ['已触达', t.touched.total, t.touched.won, t.touched.rate],
    ['未触达', t.untouched.total, t.untouched.won, t.untouched.rate],
    ['多次触达(≥3)', t.multi_touch.total, t.multi_touch.won, t.multi_touch.rate]
  ].map(function(s){ return '<td>'+s[0]+'</td><td>'+s[1]+'</td><td>'+s[2]+'</td><td>'+s[3]+'%</td>'; }));

  rows(document.getElementById('hot'), d.hot_leads.map(function(h){
    return '<td>'+h.id+'</td><td>'+h.name+'</td><td>'+h.score+'</td><td class="hot">'+h.intent_stage+'</td><td>'+h.next_action+'</td><td>'+h.status+'</td>';
  }));

  var tiers = d.by_tier || [];
  rows(document.getElementById('tier'), tiers.length ? tiers.map(function(s){
    return '<td>'+(s.tier === 'S' ? '<span class="hot">S 级</span>' : s.tier + ' 级')+'</td><td>'+s.total+'</td><td>'+s.won+'</td><td>'+s.rate+'%</td>';
  }) : ['<td colspan="4" class="note">暂无 WorkBuddy 线索，可在“线索采集 → 批量导入”上传拓客清单</td>']);

  var tleads = d.tier_leads || [];
  rows(document.getElementById('tierleads'), tleads.length ? tleads.map(function(h){
    return '<td>'+h.id+'</td><td>'+h.name+'</td><td>'+h.score+'</td><td class="hot">'+h.tier+' 级</td><td>'+h.intent_stage+'</td><td>'+h.next_action+'</td><td>'+h.status+'</td>';
  }) : ['<td colspan="7" class="note">暂无 S/A 级待跟进线索</td>']);
}).catch(function(e){ document.getElementById('msg').textContent = '请求异常：' + e; });
</script>
</body>
</html>
