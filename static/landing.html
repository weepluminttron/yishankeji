<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>__TITLE__</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(160deg, #f4f9ff 0%, #e8f4ff 100%);
      min-height: 100vh;
      color: #1f2d3d;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 40px 18px 60px; }
    .hero {
      background: linear-gradient(135deg, #0e7dd6, #00b4d8);
      border-radius: 18px;
      padding: 34px 26px;
      color: #fff;
      text-align: center;
      box-shadow: 0 14px 40px rgba(14, 125, 214, 0.3);
      margin-bottom: 20px;
    }
    .hero .logo { font-size: 40px; margin-bottom: 10px; }
    .hero h1 { font-size: 24px; line-height: 1.4; margin-bottom: 8px; }
    .hero p { font-size: 14px; opacity: 0.92; line-height: 1.7; }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(20, 40, 80, 0.08);
      padding: 26px;
      margin-bottom: 16px;
    }
    .feat { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    .feat .ico { font-size: 20px; flex-shrink: 0; }
    .feat b { font-size: 14px; }
    .feat p { color: #5b6b81; font-size: 13px; line-height: 1.6; margin-top: 2px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .field input, .field textarea {
      width: 100%;
      border: 1px solid #dbe3ee;
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
      background: #fbfdff;
    }
    .field input:focus, .field textarea:focus {
      border-color: #0e7dd6;
      box-shadow: 0 0 0 3px rgba(14, 125, 214, 0.12);
      background: #fff;
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .btn {
      display: block;
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #0e7dd6, #00b4d8);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(14, 125, 214, 0.3);
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .tip { text-align: center; color: #7a8699; font-size: 12px; margin-top: 12px; line-height: 1.7; }
    .err { color: #e05c5c; font-size: 13px; margin-bottom: 10px; display: none; }
    .hp { position: absolute; left: -9999px; }
    .ok {
      text-align: center;
      padding: 44px 20px;
    }
    .ok .big { font-size: 44px; margin-bottom: 12px; }
    .ok h2 { font-size: 20px; margin-bottom: 8px; }
    .ok p { color: #5b6b81; font-size: 14px; line-height: 1.8; }
    .phone {
      display: block;
      text-align: center;
      color: #0e7dd6;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      margin-top: 6px;
    }
    footer { text-align: center; color: #9aa8bb; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="logo">🛰️</div>
      <h1>__TITLE__</h1>
      <p>__SUBTITLE__</p>
      <p id="hero-phone"></p>
    </div>

    <div class="card" id="form-card">
      <div class="feat"><div class="ico">✅</div><div><b>厂家直供</b><p>__COMPANY__ 主营 __PRODUCT__，支持样品、批量供货</p></div></div>
      <div class="feat"><div class="ico">⚡</div><div><b>快速响应</b><p>提交后 1 个工作日内专人对接，报价透明</p></div></div>
      <div class="feat"><div class="ico">🛠️</div><div><b>一站式配套</b><p>光缆、收发器、熔接施工、FTTH / 机房改造方案</p></div></div>

      <div style="margin:20px 0 14px;border-top:1px dashed #dbe3ee"></div>
      <div class="err" id="form-err"></div>
      <div class="hp"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>
      <div class="field"><label>称呼 / 姓名 *</label><input id="name" maxlength="30" placeholder="怎么称呼您"></div>
      <div class="field"><label>公司名称</label><input id="company" maxlength="60" placeholder="所在公司（选填）"></div>
      <div class="field"><label>联系电话 *</label><input id="phone" maxlength="20" placeholder="手机或座机"></div>
      <div class="field"><label>邮箱（选填）</label><input id="email" maxlength="60" placeholder="用于发送资料与报价"></div>
      <div class="field"><label>所在地区（选填）</label><input id="region" maxlength="30" placeholder="如：广东深圳"></div>
      <div class="field"><label>需求说明（选填）</label><textarea id="need" maxlength="300" placeholder="想了解的产品、数量、项目情况…"></textarea></div>
      <button class="btn" id="submit">__CTA__</button>
      <div class="tip">提交即表示同意我们与您联系，信息仅用于业务对接，不会外泄。</div>
    </div>

    <div class="card ok" id="ok-card" style="display:none">
      <div class="big">🎉</div>
      <h2>提交成功！</h2>
      <p>__THANKS__</p>
      <a class="phone" id="ok-phone" href=""></a>
    </div>

    <footer>© __COMPANY__ · 光纤行业获客助手</footer>
  </div>

  <script>
    (function () {
      var phone = "__PHONE__";
      var heroPhone = document.getElementById("hero-phone");
      var okPhone = document.getElementById("ok-phone");
      if (phone) {
        heroPhone.innerHTML = '咨询电话：<a href="tel:' + phone + '" style="color:#fff;font-weight:700">' + phone + "</a>";
        okPhone.href = "tel:" + phone;
        okPhone.textContent = "电话咨询：" + phone;
      }

      var btn = document.getElementById("submit");
      var errBox = document.getElementById("form-err");
      btn.addEventListener("click", function () {
        var name = document.getElementById("name").value.trim();
        var phoneVal = document.getElementById("phone").value.trim();
        errBox.style.display = "none";
        if (!name) return showErr("请填写称呼或姓名");
        if (!/^1[3-9]\d{9}$/.test(phoneVal) && !/^0\d{2,3}-?\d{7,8}$/.test(phoneVal))
          return showErr("请填写正确的联系电话（手机或座机）");
        btn.disabled = true;
        btn.textContent = "提交中…";
        fetch("/api/lp/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: name,
            company: document.getElementById("company").value.trim(),
            phone: phoneVal,
            email: document.getElementById("email").value.trim(),
            region: document.getElementById("region").value.trim(),
            need: document.getElementById("need").value.trim(),
            website: document.getElementById("website").value
          })
        })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.ok) {
            document.getElementById("form-card").style.display = "none";
            document.getElementById("ok-card").style.display = "block";
          } else {
            showErr(d.msg || "提交失败，请稍后再试");
          }
        })
        .catch(function () { showErr("网络异常，请稍后再试"); })
        .finally(function () { btn.disabled = false; btn.textContent = "__CTA__"; });
      });

      function showErr(msg) {
        errBox.textContent = msg;
        errBox.style.display = "block";
      }
    })();
  </script>
</body>
</html>
